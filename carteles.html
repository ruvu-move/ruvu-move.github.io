<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RUVU · Carteles para imprimir</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Unbounded:wght@900&display=swap" rel="stylesheet">
  <style>
    /* Cartel A5 (148 × 210 mm) con el QR general, pensados para imprimir en blanco y negro. */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #888; font-family: 'Manrope', Arial, sans-serif; color: #0B0B0B; }
    .ayuda { max-width: 148mm; margin: 16px auto; background: #fff; padding: 12px 16px; border-radius: 8px; font: 14px/1.4 system-ui, sans-serif; }
    .ayuda button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 28px; border: 0; background: #0B0B0B; color: #fff; cursor: pointer; }
    .hoja {
      width: 148mm; height: 210mm; margin: 16px auto; background: #fff; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 15mm 12mm 9mm; page-break-after: always; break-after: page;
    }
    /* Proporciones tomadas del "Cartel del pretotipo (A5)" de la identidad visual */
    .prox { font-weight: 800; font-size: 6.5mm; letter-spacing: .3em; margin: 0 0 5mm; padding-left: .3em; }
    .logo { font-family: 'Unbounded', 'Arial Black', sans-serif; font-size: 27mm; font-weight: 900; line-height: 1; letter-spacing: -0.03em; margin: 0 0 5mm; }
    .logo img { height: 24mm; width: auto; }
    .texto { font-size: 7.5mm; font-weight: 600; line-height: 1.25; margin: 0 0 6mm; max-width: 100mm; }
    .qr { width: 92mm; height: 92mm; display: flex; align-items: center; justify-content: center; }
    .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
    .qr .falta { font: 14px system-ui, sans-serif; border: 2px dashed #000; padding: 12px; }
    .flecha { font-size: 5mm; font-weight: 800; margin-top: 3mm; letter-spacing: .04em; }
    .empuje { flex: 1; }
    .nombre { font-size: 3.2mm; font-weight: 600; color: #4A5154; letter-spacing: .04em; }
    @media print {
      body { background: #fff; }
      .ayuda { display: none; }
      .hoja { margin: 0; }
    }
    @media screen and (max-width: 600px) {
      .hoja { transform: scale(.6); transform-origin: top left; margin: 8px; margin-bottom: calc(-210mm * .4 + 8px); }
    }
  </style>
</head>
<body>
  <div class="ayuda">
    <b>Cartel A5 con un solo QR</b> para todas las ubicaciones: la persona escribe en qué parada está. Imprimí las copias que necesites.
    En el diálogo de impresión elegí tamaño <b>A5</b>, márgenes <b>ninguno</b> y escala <b>100%</b>.
    Probá escanear un cartel impreso antes de llevarlo a la calle.<br><br>
    <button type="button" onclick="window.print()">Imprimir</button>
  </div>
  <div id="hojas"></div>

  <script src="config.js"></script>
  <script>
    (function () {
      var C = window.RUVU_CONFIG;
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      var hojas = [{ slug: 'general', nombre: 'QR general' }]; // un solo QR para todas las ubicaciones
      document.getElementById('hojas').innerHTML = hojas.map(function (p) {
        return '<section class="hoja">' +
          '<div class="prox">PRÓXIMAMENTE</div>' +
          '<div class="logo" data-logo>RUVU.</div>' +
          '<p class="texto">Escaneá para saber cuánto tardarías</p>' +
          '<div class="qr"><img src="qr/' + encodeURIComponent(p.slug) + '.svg" alt="QR ' + esc(p.nombre) + '" ' +
          'onerror="this.parentNode.innerHTML=\'<span class=falta>Falta el QR: corré <b>npm run qr</b></span>\'"></div>' +
          '<div class="flecha">Abrí la cámara del celu y apuntá al QR</div>' +
          '<div class="empuje"></div>' +
          '<div class="nombre">' + esc(C.SITE_URL.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</div>' +
          '</section>';
      }).join('');
      // Si existe assets/logo-ruvu-negro.svg (versión negra del logo, para imprimir) se usa en vez del texto
      var img = new Image();
      img.onload = function () {
        [].forEach.call(document.querySelectorAll('[data-logo]'), function (el) { el.innerHTML = '<img src="assets/logo-ruvu-negro.svg" alt="RUVU">'; });
      };
      img.src = 'assets/logo-ruvu-negro.svg';
    })();
  </script>
</body>
</html>
