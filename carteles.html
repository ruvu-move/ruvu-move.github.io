<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RUVU · Carteles para imprimir</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    /* Carteles A5 (148 × 210 mm), uno por punto, pensados para imprimir en blanco y negro. */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #888; font-family: 'Montserrat', Arial, sans-serif; color: #000; }
    .ayuda { max-width: 148mm; margin: 16px auto; background: #fff; padding: 12px 16px; border-radius: 8px; font: 14px/1.4 system-ui, sans-serif; }
    .ayuda button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 8px; border: 0; background: #000; color: #fff; cursor: pointer; }
    .hoja {
      width: 148mm; height: 210mm; margin: 16px auto; background: #fff; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 14mm 12mm 8mm; page-break-after: always; break-after: page;
    }
    .prox {
      font-size: 13mm; font-weight: 800; letter-spacing: .06em; line-height: 1;
      border: 1.2mm solid #000; padding: 3mm 5mm; margin: 0 0 7mm;
    }
    .logo { font-size: 24mm; font-weight: 800; line-height: .9; letter-spacing: .01em; margin: 0 0 5mm; }
    .logo img { height: 22mm; width: auto; }
    .texto { font-size: 7mm; font-weight: 700; line-height: 1.15; margin: 0 0 5mm; max-width: 110mm; }
    .qr { width: 92mm; height: 92mm; display: flex; align-items: center; justify-content: center; }
    .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
    .qr .falta { font: 14px system-ui, sans-serif; border: 2px dashed #000; padding: 12px; }
    .flecha { font-size: 6mm; font-weight: 800; margin-top: 2mm; }
    .empuje { flex: 1; }
    .nombre { font-size: 3mm; font-weight: 700; color: #000; letter-spacing: .05em; text-transform: uppercase; }
    @media print {
      body { background: #fff; }
      .ayuda { display: none; }
      .hoja { margin: 0; }
    }
    @media screen and (max-width: 600px) {
      .hoja { transform: scale(.6); transform-origin: top left; margin: 8px; margin-bottom: calc(-210mm * .4 + 8px); }
    }
  </style>
</head>
<body>
  <div class="ayuda">
    <b>Carteles A5 · uno por punto.</b> Antes de imprimir: poné la URL real en <code>SITE_URL</code> de config.js y corré <code>npm run qr</code>.
    En el diálogo de impresión elegí tamaño <b>A5</b>, márgenes <b>ninguno</b> y escala <b>100%</b>.
    Probá escanear un cartel impreso antes de llevarlo a la calle.<br><br>
    <button type="button" onclick="window.print()">Imprimir</button>
  </div>
  <div id="hojas"></div>

  <script src="config.js"></script>
  <script>
    (function () {
      var C = window.RUVU_CONFIG;
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      document.getElementById('hojas').innerHTML = C.PUNTOS.map(function (p) {
        return '<section class="hoja">' +
          '<div class="prox">PRÓXIMAMENTE</div>' +
          '<div class="logo" data-logo>RUVU.</div>' +
          '<p class="texto">Escaneá para saber cuánto tardarías</p>' +
          '<div class="qr"><img src="qr/' + encodeURIComponent(p.slug) + '.svg" alt="QR ' + esc(p.nombre) + '" ' +
          'onerror="this.parentNode.innerHTML=\'<span class=falta>Falta el QR: corré <b>npm run qr</b></span>\'"></div>' +
          '<div class="flecha">▲ Abrí la cámara del celu ▲</div>' +
          '<div class="empuje"></div>' +
          '<div class="nombre">' + esc(p.nombre) + ' · ' + esc(p.slug) + '</div>' +
          '</section>';
      }).join('');
      // Si existe assets/logo-ruvu-negro.svg (versión negra del logo, para imprimir) se usa en vez del texto
      var img = new Image();
      img.onload = function () {
        [].forEach.call(document.querySelectorAll('[data-logo]'), function (el) { el.innerHTML = '<img src="assets/logo-ruvu-negro.svg" alt="RUVU">'; });
      };
      img.src = 'assets/logo-ruvu-negro.svg';
    })();
  </script>
</body>
</html>
